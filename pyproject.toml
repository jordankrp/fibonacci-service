[project]
name = "fibonacci-service"
version = "0.1.0"
description = "An HTTP service for computing Fibonacci numbers."

authors = [{ name = "Jordan Karapanagiotis", email = "jordan.krp.93@gmail.com" }]

readme = "./README.md"

requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi >=0.156.0,<1",
    "uvicorn[standard] >=0.54.0,<1",
]


[dependency-groups]
dev = [
    "pre-commit >=4.1.0,<5.0.0",
    "pytest >=9.0.0,<10",
    "pytest-random-order >=1.0.4,<2.0.0",
    "mypy >=2.0.0,<3",
    "ruff >=0.17.0,<1",
    "httpx2 >=2.16.0,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--random-order --strict-markers"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
# Extras on top of ruff's defaults: import sorting, bugbear, pyupgrade.
extend-select = ["I", "B", "UP"]

[tool.mypy]
strict = true

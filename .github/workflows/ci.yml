name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy service tests
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: check
    env:
      IMAGE: jordankrp93/fibonacci-service
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t fibonacci-service .
      - name: Smoke test the built image
        run: |
          docker run -d --name fib -p 8070:8070 fibonacci-service
          for i in $(seq 1 20); do curl -fs localhost:8070/health && break; sleep 1; done
          test "$(curl -fs localhost:8070/v1/fibonacci/5)" = "[0,1,1,2,3]"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8070/v1/fibonacci/-1)" = "422"
      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u jordankrp93 --password-stdin
          docker tag fibonacci-service "$IMAGE:$GITHUB_SHA"
          docker tag fibonacci-service "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

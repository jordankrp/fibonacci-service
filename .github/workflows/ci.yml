name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.17"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy service tests
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t fibonacci-service .
      - name: Smoke test the built image
        run: |
          docker run -d --name fib -p 8070:8070 fibonacci-service
          for i in $(seq 1 20); do curl -fs localhost:8070/v1/fibonacci/0 && break; sleep 1; done
          test "$(curl -fs localhost:8070/v1/fibonacci/5)" = "[0,1,1,2,3]"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8070/v1/fibonacci/-1)" = "422"
